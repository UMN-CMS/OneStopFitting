injection_rate: 0.0
min_counts: 0
rebin: 1

window:
  _type: CoreDilatedWindowConfig
  core_threshold_fraction: 0.5
  dilation_margin: 0.15

window_variance_inflation: 1.0

optimization:
  mode: optimization
  objective: mll
  num_iters: 200
  lr: 0.025
  optimizer: "adam"

  # schedule:
  #   _type: WarmupCosineScheduleConfig
  #   warmup_steps: 50


# domain_window:
#   _type: AndWindowConfig
#   windows:
#     - _type: FunctionSliceWindowConfig
#       expression: "y < (np.sqrt(0.003 * x / 2500) + 0.935)"
#     - _type: FunctionSliceWindowConfig
#       expression: "y > 0.7"

model:
  _type: ExactGPConfig
  kernel:
    _type: SumKernelConfig
    kernels:
    - _type: NNWarpingKernelConfig
      hidden_shapes: [20,20]
      base_kernel_config:
        _type: RBFConfig
        ard: true
    # - _type: NNTransformKernelConfig
    #   hidden_shapes: [20]
    #   base_kernel_config:
    #     _type: Matern32Config
    #     ard: true
    # - _type: WhiteConfig
    #   variance: 0.005
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.05
    # pad_variance_quantile: 0.05
  mean_function:
    _type: ConstantMeanConfig
