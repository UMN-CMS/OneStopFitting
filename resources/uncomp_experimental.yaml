injection_rate: 0.0
min_counts: 0

window:
  _type: CoreDilatedWindowConfig
  core_threshold_fraction: 0.5
  dilation_margin: 0.15


optimization:
  mode: sampling
  # objective: loocv
  objective: mll
  num_iters: 250
  optimizer: adam
  lr: 0.025
  mcmc:
    num_samples: 200
    num_warmup: 100
