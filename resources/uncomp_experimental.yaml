model:
  _type: ExactGPConfig
  kernel:
    _type: NNWarpingKernelConfig
    hidden_shapes: [5,5]
    weight_prior:
      _type: NormalPriorConfig
      loc: 0.0
      scale: 1.0
    bias_prior:
      _type: NormalPriorConfig
      loc: 0.0
      scale: 1.0
    base_kernel_config:
      _type: RBFConfig
      lengthscale_prior:
        _type: LogNormalPriorConfig
        loc: -2.3
        scale: 1.0
      variance_prior:
        _type: LogNormalPriorConfig
        loc: -0.7
        scale: 1.0
  mean_function:
    _type: ConstantMeanConfig
