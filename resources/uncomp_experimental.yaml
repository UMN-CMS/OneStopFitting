injection_rate: 0.0
min_counts: -1
rebin: 2

window:
  _type: CoreDilatedWindowConfig
  core_threshold_fraction: 0.5
  dilation_margin: 0.15


optimization:
  mode: optimization
  objective: mll
  num_iters: 250
  lr: 0.01

combine:
  eigenvar_threshold: 0.001

model:
  _type: ExactGPConfig
  kernel:
    _type: SumKernelConfig
    kernels:
    - _type: NNKernelConfig
      base_kernel_config:
        _type: RBFConfig
        ard: true
      hidden_shapes: [8,8,8]
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.05
    # pad_variance_quantile: 0.25
  mean_function:
    _type: ConstantMeanConfig