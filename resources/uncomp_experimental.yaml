model: 
  _type: ExactGPConfig
  kernel: 
    _type: NNWarpingKernelConfig
    hidden_shapes: [5,5]
    #activation: tanh
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.05
    scale_variance_value: 2
    # pad_variance_quantile: 0.25
  mean_function:
    _type: NeuralMeanConfig
    hidden_shapes: [5,5]