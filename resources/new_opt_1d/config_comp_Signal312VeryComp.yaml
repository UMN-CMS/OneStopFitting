injection_rate: 0
min_counts: -1
rebin: 2

window:
  _type: CoreDilatedWindowConfig
  core_threshold_fraction: 0.6
  dilation_margin: 0.2

# 1D (mStop only) fit: no mChiRatio axis to cut on
domain_window: null

optimization:
  mode: optimization
  objective: mll
  num_iters: 500
  optimizer: adam
  lr: 0.005
  weight_decay: 0.0001
  grad_clip_norm: 0.5
  schedule:
    _type: WarmupCosineScheduleConfig
    warmup_steps: 50
 

model: 
  _type: ExactGPConfig
  kernel:
    _type: RBFConfig 
    #_type: NNWarpingKernelConfig
    #hidden_shapes: [20,20]
    #input_dim: 1
    #output_dim: 1
    #base_kernel_config:
    #  _type: Matern32Config
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.05
  mean_function:
    _type: ConstantMeanConfig
