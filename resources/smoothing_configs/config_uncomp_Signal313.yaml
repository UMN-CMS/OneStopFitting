injection_rate: 0.0
min_counts: -1
rebin: 2

window:
  _type: CoreDilatedWindowConfig
  core_threshold_fraction: 0.5
  dilation_margin: 0.15

transform:
  _type: StandardizationConfig


optimization:
  mode: optimization
  objective: mll
  num_iters: 250
  lr: 0.025

model: 
  _type: ExactGPConfig
  kernel: 
    _type: NNWarpingKernelConfig
    hidden_shapes: [20,20]
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.2
    scale_variance_value: 2 
  mean_function:
    _type: ZeroMeanConfig
