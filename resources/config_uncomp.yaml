injection_rate: 0.0
min_counts: 1.0
window_spread: 1.75
optimization:
  num_iters: 250
  lr: 0.01
  objective: mll
  optimizer: adam
  map_prior_strength: 1.0
  use_map_priors: true


domain_window:
  _type: AndWindow
  windows:
    - _type: CutWindow
      axis: 0
      lower: 700
    - _type: CutWindow
      axis: 1
      lower: 0.1
      upper: 0.8
      
model: 
  #_type: SparseGPConfig
  _type: ExactGPConfig
  kernel: 
    _type: NNKernelConfig
