injection_rate: 0.0
min_counts: 1.0
window_spread: 1.75
optimization:
  # mode: homoscedastic_two_stage
  mode: optimization
  num_iters: 250
  lr: 0.01

model: 
  _type: ExactGPConfig
  kernel: 
    _type: NNKernelConfig
  likelihood:
    _type: FixedGaussianNoiseConfig
    variance_floor_quantile: 0.01
  mean_function:
    _type: ConstantMeanConfig
